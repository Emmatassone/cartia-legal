[project]
name = "cartia-backend"
version = "0.1.0"
description = "Backend de CartIA Legal: workflow RAG con LangGraph, auth y conversaciones"
requires-python = ">=3.11"
dependencies = [
    "cartia-shared",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic-settings>=2.6",
    "sqlmodel>=0.0.22",
    "alembic>=1.14",
    "psycopg[binary,pool]>=3.2",
    "bcrypt>=4.2",
    "pyjwt>=2.10",
    "email-validator>=2.2",
    "httpx>=0.27",
    "langgraph>=0.2.60",
    "langchain-core>=0.3.28",
    "langchain-google-genai>=2.0.8",
    "google-genai>=1.0",
    "python-multipart>=0.0.20",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]

[tool.uv.sources]
cartia-shared = { path = "../shared", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
