[project]
name = "cartia-rag"
version = "0.1.0"
description = "Servicio de retrieval de CartIA Legal: busqueda hibrida sobre pgvector"
requires-python = ">=3.11"
dependencies = [
    "cartia-shared",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0.36",
    "psycopg[binary,pool]>=3.2",
    "google-genai>=1.0",
    "httpx>=0.27",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "sqlparse>=0.6.0",
]

[tool.uv.sources]
cartia-shared = { path = "../shared", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
