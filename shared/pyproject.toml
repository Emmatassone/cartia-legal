[project]
name = "cartia-shared"
version = "0.1.0"
description = "DTOs y enums compartidos entre los servicios de CartIA Legal"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.9",
    "google-genai>=1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cartia_shared"]
